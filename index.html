<style>
:root{--bg:#F6F6F3;--ink:#16181D;--mut:#4F566A;--card:#fff;--line:#C4C9D4;--blk:#1F2430;--p1:#1F5FC4;--p1t:#DCE8FB;--p2:#B04400;--p2t:#FBE6D6;--hl:#FFF3BF;--cur:#FFD65C;--key:#fff;--keyb:#D5D9E2;--ok:#0B6B4D;--ovl:rgba(22,24,29,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141A;--ink:#ECEEF3;--mut:#A8AFC0;--card:#1C1F27;--line:#3A3F4D;--blk:#05060A;--p1:#8DB9FF;--p1t:#1E3358;--p2:#FFA066;--p2t:#4A2A14;--hl:#3F3A1C;--cur:#7A6414;--key:#2A2E3A;--keyb:#3A3F4D;--ok:#5BD3A5}}
:root[data-theme="dark"]{--bg:#12141A;--ink:#ECEEF3;--mut:#A8AFC0;--card:#1C1F27;--line:#3A3F4D;--blk:#05060A;--p1:#8DB9FF;--p1t:#1E3358;--p2:#FFA066;--p2t:#4A2A14;--hl:#3F3A1C;--cur:#7A6414;--key:#2A2E3A;--keyb:#3A3F4D;--ok:#5BD3A5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
.scores{display:flex;gap:8px}
.chip{flex:1;background:var(--card);border-radius:10px;padding:8px 10px;border-bottom:4px solid var(--line)}
.chip.on{border-bottom-color:currentColor}
.chip{display:flex;align-items:center;gap:6px;padding:6px 8px}.av{flex:0 0 auto;line-height:0}.ct{min-width:0}.chip small.dr{display:inline;font-weight:500}
.chip small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:12px;font-weight:600;color:var(--mut)}
.chip b{font-size:26px;line-height:1.1}
.p0{color:var(--p1)}.p1{color:var(--p2)}
.left{font-size:12px;color:var(--mut);margin-top:2px;letter-spacing:2px}
#grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--blk);width:100%;aspect-ratio:1;background:var(--blk)}
.c{position:relative;border:1px solid var(--line);background:var(--card);padding:0;font:700 clamp(16px,5.4vw,24px) system-ui,sans-serif;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:0;min-width:0}
.c.k{background:var(--blk);border-color:var(--blk)}
.c.hl{background:var(--hl)}
.c.cur{background:var(--cur);box-shadow:inset 0 0 0 4px var(--ink);z-index:2;transform:scale(1.14);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--ink),0 0 0 3px var(--cur)}}
.c.bad{background:rgba(214,40,40,.25)}.c.bad.cur{background:var(--cur)}
.pop{position:fixed;z-index:8;pointer-events:none;font:900 22px Georgia,serif;opacity:0;transform:translate(-60%,-60%);animation:pp 1.6s ease both;text-shadow:0 0 6px var(--bg),0 0 6px var(--bg),0 1px 0 var(--bg)}
.pop.st::before{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:-1;opacity:.35;background:repeating-conic-gradient(currentColor 0 7deg,transparent 7deg 30deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 72%);mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 72%)}
@keyframes pp{0%{opacity:0;transform:translate(-60%,-40%) scale(.5)}20%{opacity:1;transform:translate(-60%,-60%) scale(1.2)}70%{opacity:1;transform:translate(-60%,-90%) scale(1)}100%{opacity:0;transform:translate(-60%,-130%) scale(1)}}
.flash{position:fixed;left:0;right:0;top:34%;text-align:center;font:900 44px Georgia,serif;letter-spacing:2px;pointer-events:none;z-index:9;opacity:0;animation:fl 1.8s ease both;text-shadow:0 0 10px var(--bg),0 2px 0 var(--bg)}
@keyframes fl{0%{opacity:0;transform:scale(.6)}30%,60%{opacity:1;transform:scale(1.35)}100%{opacity:0;transform:scale(1)}}
.c.o0{color:var(--p1)}.c.o1{color:var(--p2)}
.c.s.o0{background:var(--p1t)}.c.s.o1{background:var(--p2t)}
.c i{position:absolute;top:1px;left:2px;font:600 9px system-ui;font-style:normal;color:var(--mut)}
#clue{background:var(--card);border-radius:10px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:8px;min-height:64px;border-left:6px solid currentColor}

#clue small{display:block;font:600 12px system-ui,sans-serif;color:var(--mut)}
.nav{width:44px;height:44px;border:1px solid var(--line);background:var(--key);color:var(--ink);border-radius:10px;font-size:20px}
#msg{min-height:20px;font-size:14px;color:var(--mut);text-align:center}
#kb{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:5px;justify-content:center}

.k.w{flex:1.6;background:var(--keyb)}

button{cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#ovl{position:fixed;inset:0;background:var(--ovl);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
#ovl.show{display:flex}

.big{height:50px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:700 17px system-ui,sans-serif}
#tools{display:flex;gap:8px;justify-content:center}
#bell,#chatb,#rulesb{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 14px;font:600 13px system-ui,sans-serif}
#bell[hidden],#chatb[hidden],#rulesb[hidden],#chat[hidden]{display:none}
#chatb.new{color:var(--ink);border-color:var(--ink)}
#chat{position:fixed;inset:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#chh b{font:700 18px Georgia,serif}

#chl .m{max-width:80%;padding:8px 12px;border-radius:14px;font-size:16px;line-height:1.35;background:var(--card);word-wrap:break-word;overflow-wrap:anywhere}
#chl .me{align-self:flex-end;border-bottom-right-radius:4px;background:var(--p1t);color:var(--ink)}
#chl .me.p1{background:var(--p2t)}
#chl .them{align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
#chl .none{margin:auto;color:var(--mut);font-size:14px;text-align:center}
#chf{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#chi{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:16px system-ui,sans-serif;background:var(--card);color:var(--ink)}
#chs{height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:700 16px system-ui,sans-serif}
.big.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
#lk{word-break:break-all;font-size:14px;background:var(--bg);padding:8px 10px;border-radius:8px;display:block}
.c.pnd:not(.cur){box-shadow:inset 0 0 0 2px currentColor;font-style:italic}
#end[disabled]{opacity:.4}
#toast{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:12;display:flex;justify-content:center;padding:10px;pointer-events:none}
.tmsg{pointer-events:auto;touch-action:none;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font:600 16px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(-30px)}}
.st::before,.ng::before{content:"";position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;z-index:-1;opacity:.4;background:repeating-conic-gradient(currentColor 0 7deg,transparent 7deg 30deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 72%);mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 72%)}
.ng::before{color:#d62828;opacity:.6}
.mg{display:flex;justify-content:center;gap:3px;margin:16px 0 10px}
.mc{width:38px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 20px Georgia,serif;position:relative}
.mc b{position:absolute;opacity:0;animation:ty 6s infinite both}
.mc.cu{box-shadow:inset 0 0 0 3px var(--ink);animation:pulse 1s infinite}
@keyframes ty{0%{opacity:0;transform:scale(.4)}6%{opacity:1;transform:scale(1.25)}10%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0}}
.mc .a{animation:mo 6s infinite both}.mc .n{animation:mi 6s infinite both}
@keyframes mo{0%,35%{opacity:1}45%,88%{opacity:0}96%,100%{opacity:1}}
@keyframes mi{0%,35%{opacity:0}45%,88%{opacity:1}96%,100%{opacity:0}}
.mb{display:inline-block;padding:10px 26px;border-radius:12px;background:var(--ink);color:var(--bg);font:700 16px system-ui,sans-serif;animation:bp 2s infinite}
@keyframes bp{50%{transform:scale(1.08)}}
.mp{position:absolute;right:-8px;top:-14px;font:900 17px Georgia,serif;opacity:0;animation:mpa 6s infinite;z-index:2}
@keyframes mpa{0%,40%{opacity:0;transform:translateY(8px) scale(.5)}48%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:translateY(-12px)}85%,100%{opacity:0;transform:translateY(-20px)}}
.tint{animation:tn 6s infinite both}
@keyframes tn{0%,35%{background:var(--p1t)}45%,90%{background:var(--p2t)}100%{background:var(--p1t)}}
.tt{margin:16px auto;max-width:260px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font:600 15px system-ui,sans-serif;animation:ttn 6s infinite both}
@keyframes ttn{0%,5%{transform:translateY(-30px);opacity:0}12%,55%{transform:none;opacity:1}75%,100%{transform:translateX(120px);opacity:0}}
</style>

<body>
<div id="app">
<div class="scores" id="scores"></div>
<div id="grid" role="grid" aria-label="Crossword grid"></div>
<div id="clue"></div>
<div id="msg" aria-live="polite"></div>
<div id="tools"><button id="bell" hidden>🔔 Get turn alerts</button><button id="rulesb" hidden>📖 Rules</button><button id="chatb" hidden>💬 Taunt</button></div>
<div id="kb"></div>
</div>
<div id="chat" hidden><div id="chh"><b>Taunts</b><button id="chx" aria-label="Close chat">✕</button></div><div id="chl" aria-live="polite"></div><div id="chf"><input id="chi" maxlength="200" placeholder="Taunt your friend" autocomplete="off" enterkeyhint="send" aria-label="Message"><button id="chs">Send</button></div></div>
<div id="toast"></div>
<div id="ovl"><div id="box"></div></div>
<script src="icons.js"></script>
<script>
(async()=>{const PZ=[],notes=[];
 let miss=0;for(let i=1;i<=99&&miss<3;i++){const f="puzzles/batch-"+String(i).padStart(3,"0")+".json";let r=null;try{r=await fetch(f,{cache:"no-cache"})}catch(e){notes.push(f+": network error")}
  if(!r||!r.ok){if(r)notes.push(f+": HTTP "+r.status);miss++;continue}miss=0;try{const j=await r.json();if(Array.isArray(j))PZ.push(...j);else notes.push(f+": not a list")}catch(e){notes.push(f+": found, but can’t be read ("+e.message+")")}}
 if(!PZ.length){const d=document.createElement("p");d.style.cssText="padding:24px;color:#888;font:14px sans-serif";d.textContent="Couldn’t load the puzzles. "+notes.join(" | ");document.body.prepend(d);return}
 window.ICONS=window.ICONS||{D:[{n:"Player 1",s:"Player 1",k:""},{n:"Player 2",s:"Player 2",k:""}],svg:()=>"",card:()=>"",pick2:()=>[0,1]};window.PZ=PZ;const s=document.createElement("script");s.textContent=document.getElementById("main").textContent;document.body.appendChild(s)})();
</script>
<script type="text/plain" id="main">
const pn0=(()=>{const m=/^#p(\d+)$/.exec(location.hash);if(m&&+m[1]>=1&&+m[1]<=PZ.length)return +m[1]-1;const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%PZ.length})();
let pn,G,CK;
const N=9,DN=["Across","Down"];let NAMES=["Player 1","Player 2"],DIR=["A","D"],IC=[0,1],PN=["",""],MYN="";
const white=(r,c)=>r>=0&&c>=0&&r<N&&c<N&&G[r][c]!=="#";
let slots,nums,cw;function build(i){pn=i;G=PZ[i].grid;CK={};PZ[i].across.forEach(a=>CK["A"+a.num]=a.clue);PZ[i].down.forEach(a=>CK["D"+a.num]=a.clue);slots=[];nums={};cw={};let n=0;
for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!white(r,c))continue;
 const sa=!white(r,c-1)&&white(r,c+1),sd=!white(r-1,c)&&white(r+1,c);
 if(sa||sd){n++;nums[r+","+c]=n}
 [[sa,"A",0,1],[sd,"D",1,0]].forEach(([f,d,dr,dc])=>{if(!f)return;const cells=[];let a=r,b=c;
  while(white(a,b)){cells.push([a,b]);a+=dr;b+=dc}
  const ans=cells.map(([x,y])=>G[x][y]).join("");
  const s={dir:d,num:n,cells,ans,clue:CK[d+n]};slots.push(s);
  cells.forEach(([x,y])=>{(cw[x+","+y]=cw[x+","+y]||{})[d]=s})})}}
build(pn0);

const API="/api/game";
let L,turn,left,score,solved,cur,pend,award,PP,msg,over,overShown,note="",online=null,timer=null,ev=null,lastEv=null,lastPopId=0;
const setNames=()=>{NAMES=[PN[0]||ICONS.D[IC[0]].s,PN[1]||ICONS.D[IC[1]].s]};
const cleanName=t=>String(t||"").replace(/[\u0000-\u001f<>&"]/g," ").replace(/\s+/g," ").trim().slice(0,16);
function askName(next){let v="";try{v=cleanName(localStorage.getItem("kc-name"))}catch(e){}
 ask('<h1>What’s your name?</h1><p>Your friend will see it next to your score. You’ll be given a random icon.</p><input id="pn" maxlength="16" value="'+v+'" placeholder="Your name" autocomplete="off" autocapitalize="words" style="width:100%;box-sizing:border-box;font:18px system-ui,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">',[["Continue",()=>{MYN=cleanName(document.getElementById("pn").value);try{localStorage.setItem("kc-name",MYN)}catch(e){}next()}]])}
const pd=i=>DN[DIR[i]==="A"?0:1];
const myTurn=()=>!online||turn===online.seat;
const viewer=()=>online?online.seat:turn;
function start(){L=Array.from({length:N},()=>Array(N).fill(null));turn=0;left=3;score=[0,0];solved=new Set();pend=[];award=Array(slots.length).fill(null);PP=[];msg="";over=false;overShown=false;ev=null;pick(null)}
const mine=()=>slots.filter(s=>s.dir===DIR[viewer()]&&!solved.has(s));
const isP=(r,c)=>pend.findIndex(p=>p.r===r&&p.c===c);
const at=(r,c)=>["A","D"].map(d=>cw[r+","+c][d]).filter(Boolean);
const canTry=(r,c)=>{const v=L[r][c];return !v||isP(r,c)>=0||v.a===turn||at(r,c).some(s=>solved.has(s))};
function pick(w){const l=mine();w=w||l[0];if(!w){cur=null;return}cur={w,cell:w.cells.find(([r,c])=>!L[r][c])||w.cells[0]}}
function sel(r,c){const w=cw[r+","+c][DIR[viewer()]];if(!w)return;cur={w,cell:[r,c]};msg="";render()}
function cycle(d){const l=mine();if(!l.length)return;let i=l.indexOf(cur&&cur.w);i=(i+d+l.length)%l.length;pick(l[i]);render()}
function type(ch){if(over||!cur||!myTurn()||(online&&!online.joined))return;const [r,c]=cur.cell;
 if(isP(r,c)<0){
  if(pend.length>=3){msg="That’s your 3 letters. Tap one you placed to change it, or tap Submit.";return render()}
  if(!canTry(r,c)){msg="That letter is your friend’s. It can only change once its word is full.";return render()}
  pend.push({r,c,prev:L[r][c]})}
 L[r][c]={ch,o:turn,a:turn};left=3-pend.length;msg="";
 const w=cur.w,n=w.cells.length,k=w.cells.findIndex(([x,y])=>x===r&&y===c);
 for(let j=1;j<n;j++){const q=w.cells[(k+j)%n];if(!L[q[0]][q[1]]){cur.cell=q;break}}
 render()}
function back(){if(over||!myTurn()||!pend.length)return;let i=cur?isP(cur.cell[0],cur.cell[1]):-1;if(i<0)i=pend.length-1;
 const p=pend.splice(i,1)[0];L[p.r][p.c]=p.prev;left=3-pend.length;cur={w:cw[p.r+","+p.c][DIR[turn]],cell:[p.r,p.c]};msg="";render()}
function submit(){if(over||!myTurn()||(online&&!online.joined))return;
 const P=turn,Q=1-P,before=[score[0],score[1]],id=Date.now();
 const last=pend.length?[pend[pend.length-1].r,pend[pend.length-1].c]:null;
 let locked=0,steal=false;const cleared=[],corr=[];
 // a letter typed over an already-correct letter changes nothing
 pend.forEach(p=>{if(!p.prev)return;const t=G[p.r][p.c];if(p.prev.ch===t){L[p.r][p.c]=p.prev;locked++}else if(L[p.r][p.c].ch===t)corr.push(p)});
 // fixing a wrong letter wipes every wrong letter in that word
 corr.forEach(p=>at(p.r,p.c).filter(s=>solved.has(s)).forEach(s=>s.cells.forEach(([x,y])=>{if(L[x][y]&&L[x][y].ch!==G[x][y]){L[x][y]=null;cleared.push([x,y])}})));
 // fixing a letter your friend got wrong earns a small bonus
 corr.forEach(p=>{if(p.prev.a!==P)score[P]+=3});
 // any word that lost a letter gives its points back
 const und=new Set();cleared.forEach(([x,y])=>at(x,y).forEach(w=>{if(solved.has(w))und.add(w)}));
 und.forEach(w=>{const i=slots.indexOf(w),a=award[i];solved.delete(w);if(a){score[a.w]-=a.p;award[i]=null}});
 // full words score as if correct
 slots.forEach((w,i)=>{if(!solved.has(w)&&w.cells.every(([x,y])=>L[x][y])){const st=w.dir!==DIR[P],pt=(st?15:10)+w.cells.length;score[P]+=pt;solved.add(w);award[i]={w:P,p:pt};if(st){steal=true;w.cells.forEach(([x,y])=>{L[x][y].o=P})}}});
 const d=[score[0]-before[0],score[1]-before[1]],sg=n=>(n<0?"−":"+")+Math.abs(n),pops=[];
 if(last)pops.push({id,txt:sg(d[P]),o:P,r:last[0],c:last[1],k:d[P]<0?"ng":(steal?"st":"")});
 if(d[Q]<0&&cleared.length)pops.push({id:id+1,txt:sg(d[Q]),o:Q,r:cleared[0][0],c:cleared[0][1],k:"ng"});
 msg=NAMES[P]+" "+(d[P]<0?"lost "+Math.abs(d[P]):"scored "+d[P])+(steal?" with a steal":"")+"."+(cleared.length?" Wrong letters were removed from a word.":"")+(corr.some(p=>p.prev.a!==P)?" +3 for each of "+NAMES[Q]+"’s wrong letters fixed.":"");
 ev=steal?{id,txt:"STOLEN! "+sg(d[P]),o:P}:null;if(ev)lastEv=id;
 over=L.every((row,r)=>row.every((v,c)=>G[r][c]==="#"||(v&&v.ch===G[r][c])));
 PP=pops;lastPopId=id+1;pend=[];left=3;if(!over)turn=Q;
 sync();
 if(locked)msg+=" "+locked+" of your letters "+(locked>1?"were":"was")+" already right, so nothing changed.";
 pick(null);render();showPops(pops);if(ev)flash(ev)}
function showPops(l){l.forEach((p,i)=>setTimeout(()=>popover(p),80+i*250))}
function popover(p){const b=document.querySelector('#grid button[data-r="'+p.r+'"][data-c="'+p.c+'"]');if(!b)return;const R=b.getBoundingClientRect(),d=document.createElement("div");d.className="pop p"+p.o+(p.k?" "+p.k:"");d.textContent=p.txt;d.style.left=R.right+"px";d.style.top=R.top+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function flash(e){const d=document.createElement("div");d.className="flash p"+e.o;d.textContent=e.txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
function ask(html,btns){const o=document.getElementById("ovl"),b=document.getElementById("box");
 b.innerHTML=html+btns.map((x,i)=>'<button class="big'+(x[2]?" alt":"")+'" data-i="'+i+'">'+x[0]+"</button>").join("");o.classList.add("show");
 b.querySelectorAll("button").forEach(el=>{el.onclick=()=>{const x=btns[+el.dataset.i];if(!x[3])o.classList.remove("show");if(x[1])x[1](el)}});
 const f=b.querySelector("button");if(f)f.focus()}
const show=(html,label,fn)=>ask(html,[[label,fn]]);
const rules="<p>Finish a word to score 10 + 1 per letter, or 15 + 1 per letter for a steal. Nothing is judged until you tap Submit. Wrong letters aren’t marked. When anyone fixes one, every wrong letter in that word disappears and its points are taken back. Fixing your friend’s wrong letter earns 3 points.</p>";
function render(){
 const my=myTurn(),vw=viewer();left=3-pend.length;
 document.getElementById("scores").innerHTML=[0,1].map(i=>'<div class="chip p'+i+(i===turn&&!over?" on":"")+'"><div class="av">'+ICONS.svg(IC[i],54)+'</div><div class="ct"><small>'+NAMES[i]+(online&&i===online.seat?" (you)":"")+'</small><b>'+score[i]+'</b> <small class="dr">'+pd(i)+'</small>'+(i===turn&&!over?'<div class="left" aria-label="'+left+' letters left">'+"●".repeat(left)+"○".repeat(3-left)+"</div>":"")+"</div></div>").join("");
 let h="";for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=r+","+c;
  if(!white(r,c)){h+='<div class="c k"></div>';continue}
  const v=L[r][c],pn=isP(r,c)>=0,isCur=cur&&cur.cell[0]===r&&cur.cell[1]===c,inW=cur&&cur.w.cells.some(([x,y])=>x===r&&y===c);
  const sv=at(r,c).some(w=>solved.has(w));
  h+='<button class="c'+(v?" o"+v.o:"")+(pn?" pnd":"")+(sv&&!pn?" s":"")+(inW?" hl":"")+(isCur?" cur":"")+'" data-r="'+r+'" data-c="'+c+'" aria-label="Row '+(r+1)+", column "+(c+1)+(v?", "+v.ch:", empty")+'">'+(nums[k]?"<i>"+nums[k]+"</i>":"")+(v?v.ch:"")+"</button>"}
 const g=document.getElementById("grid");g.innerHTML=h;g.querySelectorAll("button").forEach(b=>b.onclick=()=>sel(+b.dataset.r,+b.dataset.c));
 const cl=document.getElementById("clue");cl.className="p"+vw;
 cl.innerHTML=cur?'<button class="nav" aria-label="Previous word">‹</button><div><small>'+cur.w.num+" "+DN[cur.w.dir==="A"?0:1]+" · "+cur.w.cells.length+" letters</small>"+cur.w.clue+'</div><button class="nav" aria-label="Next word">›</button>':(over?"<div>Game over.</div>":"<div>No words left to try.</div>");
 if(cur){const b=cl.querySelectorAll(".nav");b[0].onclick=()=>cycle(-1);b[1].onclick=()=>cycle(1)}
 document.getElementById("msg").textContent=note||msg||(!my&&!over?"Waiting for "+NAMES[turn]+"…":"");
 const eb=document.getElementById("end");if(eb){eb.disabled=!my||over;eb.textContent="Submit"+(pend.length?" ("+pend.length+")":"")}
 tools();
 if(over&&!overShown){overShown=true;const w=score[0]===score[1]?"It’s a tie.":NAMES[score[0]>score[1]?0:1]+" wins.";
  show("<h1>"+w+"</h1><p>"+NAMES[0]+": "+score[0]+"<br>"+NAMES[1]+": "+score[1]+"</p>","New game",()=>{location.href=location.pathname})}}
const mc=(i,c,x)=>'<div class="mc '+(c||"")+'">'+(i||"")+(x||"")+"</div>",ty=(ch,d)=>'<b style="animation-delay:'+d+'s">'+ch+"</b>",sw=(a,b)=>'<b class="a">'+a+'</b><b class="n">'+b+"</b>";
const TUT=[
["Pick a square and type","<div class=\"mg\">"+mc(ty("S",.4),"cu")+mc(ty("U",1.2))+mc(ty("N",2))+mc()+mc()+"</div>","Tap a square in one of your words, then type. The pulsing square is where your next letter goes. You can place up to 3 letters a turn."],
["Change your mind","<div class=\"mg\">"+mc("C")+mc("A")+mc(sw("R","T"))+"</div>","Tap a letter you placed and type over it, or use ⌫ to take it back. Nothing counts until you submit."],
["Submit","<div class=\"mg\">"+mc("C")+mc("A")+mc("T",0,'<span class="mp" style="color:var(--p1)">+13</span>')+'</div><div style="text-align:center"><span class="mb">Submit</span></div>',"Tap Submit to end your turn. Words you finish score 10 + 1 per letter, and the points pop up over your last letter."],
["Steal a word","<div class=\"mg\">"+mc("G","tint")+mc("A","tint")+mc("M","tint")+mc("E","tint",'<span class="mp st" style="color:var(--p2)">+19</span>')+"</div>","Finish a word in your friend’s direction to steal it: 15 + 1 per letter, and the whole word turns your color."],
["Fix a mistake","<div class=\"mg\">"+mc("P")+mc(sw("X","L"))+mc("A")+mc(sw("Z",""),0,'<span class="mp ng" style="color:var(--p1)">−13</span>')+mc("E")+"</div>","Wrong letters aren’t marked. If you or your friend fix one, every wrong letter in that word disappears and the points it earned are taken back. Fixing a letter your friend got wrong earns you 3 points."],
["Taunt","<div class=\"tt\">💬 Nice try! 😏</div>","Taunt your friend any time. Messages pop up at the top for a few seconds. Swipe one away to dismiss it."]];
function tut(i,skip){const t=TUT[i],last=i===TUT.length-1;
 ask("<h1>"+t[0]+"</h1>"+t[1]+"<p>"+t[2]+'</p><p style="color:var(--mut);font-size:13px">'+(i+1)+" of "+TUT.length+"</p>",last?[["Got it"]]:[["Next",()=>tut(i+1,skip),0,1],[skip||"Close",null,1]])}
function tutAsk(){ask("<h1>New to KleptoCross?</h1><p>A short animated tour shows every move.</p>",[["View tutorial",()=>tut(0,"Skip"),0,1],["Skip",null,1]])}
document.getElementById("rulesb").onclick=()=>tut(0,"Close");
function menu(){ask("<h1>KleptoCross</h1><p>Puzzle "+(pn+1)+" of "+PZ.length+". Take turns writing up to 3 letters, then tap Submit. You’ll be Player 1. One of you solves the Across clues and the other the Down clues, chosen at random.</p>"+rules,
 [["Invite a friend",()=>askName(createGame)]])}

/* ---------- two-phone play ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function call(q,opt){const r=await fetch(API+q,opt);let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||"http "+r.status);e.status=r.status;throw e}return j}
const post=b=>call("",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
const saved={get(c){try{return JSON.parse(localStorage.getItem("cd-"+c))}catch(e){return null}},set(c,v){try{localStorage.setItem("cd-"+c,JSON.stringify(v))}catch(e){}}};
const snap=()=>({L,turn,left:3,score,solved:[...solved].map(s=>slots.indexOf(s)),award,dir:DIR,ic:IC,over,msg,ev,pops:PP});
function applySnap(s,loud){const k=cur?{i:slots.indexOf(cur.w),cell:cur.cell}:null;
 DIR=s.dir||["A","D"];IC=s.ic||[0,1];setNames();award=s.award||Array(slots.length).fill(null);
 PP=s.pops||[];const mx=PP.reduce((m,p)=>Math.max(m,p.id),0);if(loud&&mx>lastPopId)showPops(PP.filter(p=>p.id>lastPopId));lastPopId=Math.max(lastPopId,mx);
 ev=s.ev||null;if(ev){if(loud&&ev.id!==lastEv)flash(ev);lastEv=ev.id}
 L=s.L;turn=s.turn;left=3;score=s.score;solved=new Set(s.solved.map(i=>slots[i]));over=s.over;msg=s.msg||"";pend=[];
 if(k&&k.i>=0&&!over)cur={w:slots[k.i],cell:k.cell};else{cur=null;if(!over)pick(null)}}
const link=()=>location.origin+location.pathname+"?game="+online.code;
function sync(){if(!online)return;online.dirty=true;if(!online.pushing)flush()}
async function flush(){online.pushing=true;
 while(online.dirty){online.dirty=false;
  try{const j=await post({action:"push",code:online.code,token:online.token,version:online.ver,state:snap()});online.ver=j.version;if(note){note="";render()}}
  catch(e){if(e.status===409||e.status===403){try{await pollOnce(true)}catch(x){}}else{online.dirty=true;note="Connection problem, retrying…";render();await sleep(1500)}}}
 online.pushing=false}
async function pollOnce(force){if(!online)return;
 const q="?code="+encodeURIComponent(online.code)+"&token="+encodeURIComponent(online.token)+(Date.now()-lastInput<180000?"&ping=1":"")+(online.joined?"&since="+Math.max(0,online.since-5000):"");
 const j=await call(q,{cache:"no-store"});
 if(j.names&&(j.names[0]!==PN[0]||j.names[1]!==PN[1])){PN=j.names;setNames();render()}
 if(j.chat)addMsgs(j.chat);
 if(note){note="";render()}
 if(!online.joined&&j.joined){online.joined=true;ask("<h1>Your friend joined!</h1>"+ICONS.card(IC[online.seat],110)+"<p>You play <b>"+pd(online.seat)+"</b>. "+(online.seat===0?"You go first.":NAMES[0]+" goes first, and the board updates when it’s your turn.")+"</p>"+rules,[["Start",()=>{render();tutAsk()}]])}
 if(j.version>online.ver&&(force||turn!==online.seat)){const prev=turn;online.ver=j.version;applySnap(j.state,true);render();
  if(!over&&prev!==turn&&turn===online.seat)show("<h1>Your turn</h1><p>"+(msg?msg+"<br><br>":"")+"You play <b>"+pd(turn)+"</b>.</p>","Start my turn",()=>render())}}
function loop(){clearInterval(timer);timer=setInterval(()=>{if(online&&!document.hidden&&!online.pushing&&(!over||chatOpen))pollOnce().catch(()=>{})},4000)}
document.addEventListener("visibilitychange",()=>{if(online&&!document.hidden&&!over)pollOnce().catch(()=>{})});
function waitScreen(){ask('<h1>Invite a friend</h1>'+ICONS.card(IC[online.seat],110)+'<p>Send this link to a friend. When they open it, the game begins. You are Player 1 and play <b>'+pd(online.seat)+'</b>'+' and go first.'+'</p><b id="lk"></b>',
 [["Share link",async el=>{const u=link();try{if(navigator.share){await navigator.share({title:"KleptoCross",text:"Join me for a crossword duel!",url:u});return}}catch(e){if(e&&e.name==="AbortError")return}
   try{await navigator.clipboard.writeText(u);el.textContent="Link copied ✓"}catch(e){el.textContent="Copy the link above"}},0,1],
  ["Cancel",()=>{location.href=location.pathname},1]]);
 document.getElementById("lk").textContent=link()}
const keep=()=>{try{history.replaceState(null,"","?game="+online.code+"&k="+online.token)}catch(e){}};
async function createGame(){
 try{DIR=Math.random()<.5?["A","D"]:["D","A"];IC=ICONS.pick2();setNames();start();const j=await post({action:"create",pz:pn,state:snap(),name:MYN});PN=[MYN,""];setNames();
  online={code:j.code,token:j.token,seat:j.seat,ver:j.version,joined:false,pushing:false,dirty:false,alerts:false,since:0};saved.set(j.code,{token:j.token,seat:j.seat});
  keep();render();waitScreen();loop();ping();autoAlerts()}
 catch(e){online=null;ask("<h1>Couldn’t start</h1><p>The game server didn’t answer. Check your connection and try again.</p>",[["Back",menu]])}}
async function joinGame(code,kt){let me=saved.get(code);
 try{
  if(kt){const j=await call("?code="+code+"&token="+encodeURIComponent(kt),{cache:"no-store"});if(j.seat===0||j.seat===1){me={token:kt,seat:j.seat};saved.set(code,me)}}
  if(me&&me.token){const j=await call("?code="+code,{cache:"no-store"});build(j.pz);
   online={code,token:me.token,seat:me.seat,ver:j.version,joined:j.joined,pushing:false,dirty:false,alerts:false,since:0};PN=j.names||["",""];applySnap(j.state);keep();render();loop();ping();autoAlerts();
   if(!j.joined)waitScreen();else if(!over)show("<h1>Welcome back</h1><p>You play <b>"+pd(online.seat)+"</b>."+(myTurn()?" It’s your turn.":" Waiting for "+NAMES[turn]+".")+"</p>","Continue",()=>render());
   return}
  const j=await post({action:"join",code,name:MYN});build(j.pz);
  online={code,token:j.token,seat:j.seat,ver:j.version,joined:true,pushing:false,dirty:false,alerts:false,since:0};saved.set(code,{token:j.token,seat:j.seat});
  PN=j.names||["",""];applySnap(j.state);keep();render();loop();ping();autoAlerts();
  show("<h1>You’re in!</h1>"+ICONS.card(IC[online.seat],110)+"<p>You play <b>"+pd(online.seat)+"</b>. "+(myTurn()?"You go first.":NAMES[0]+" goes first, and the board updates when it’s your turn.")+"</p>"+rules,"OK",()=>{render();tutAsk()})}
 catch(e){online=null;ask("<h1>Can’t join</h1><p>"+(e.status===409?"This game already has two players.":e.status===404?"That game wasn’t found. Ask your friend for a new link.":"The game server didn’t answer. Try again in a moment.")+"</p>",[["Back to start",()=>{location.href=location.pathname}]])}}

/* ---------- turn alerts ---------- */
// "I'm here" signal: sent only while the page is visible and touched in the last 3 minutes.
// The server skips the alert while these keep arriving, and sends one when they stop.
let lastInput=Date.now();
["pointerdown","keydown"].forEach(t=>document.addEventListener(t,()=>{lastInput=Date.now()},{passive:true}));
function ping(){if(online)pollOnce().catch(()=>{})}
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const b64u=t=>{const p="=".repeat((4-t.length%4)%4),r=atob((t+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function enableAlerts(tap){if(!online)return;
 if(!pushOK()){if(tap)ask("<h1>Turn alerts</h1><p>This browser can’t show alerts. <b>On iPhone:</b> tap the Share button in Safari, choose <b>Add to Home Screen</b>, then open the game from that icon and tap this button again. <b>On Android or a computer:</b> use Chrome or Edge.</p>",[["OK"]]);return}
 try{
  if(Notification.permission==="denied"){if(tap)ask("<h1>Alerts are blocked</h1><p>Allow notifications for this site in your phone’s or browser’s settings, then tap the button again.</p>",[["OK"]]);return}
  if(Notification.permission!=="granted"){if(!tap)return;if(await Notification.requestPermission()!=="granted"){render();return}}
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub){const k=await call("?vapid=1");sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.publicKey)})}
  await post({action:"subscribe",code:online.code,token:online.token,sub:sub.toJSON()});online.alerts=true;render()}
 catch(e){if(tap)ask("<h1>Couldn’t turn on alerts</h1><p>Something went wrong. Please try again in a moment.</p>",[["OK"]])}}
async function disableAlerts(){try{await post({action:"unsubscribe",code:online.code,token:online.token})}catch(e){}online.alerts=false;render()}
function autoAlerts(){if(pushOK()&&Notification.permission==="granted")enableAlerts(false)}
document.getElementById("bell").onclick=()=>{if(online)online.alerts?disableAlerts():enableAlerts(true)};
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")}catch(e){}

/* ---------- chat ---------- */
let chat=[],chatIds=new Set(),unread=0,chatOpen=false;
function tools(){const bl=document.getElementById("bell"),cb=document.getElementById("chatb");
 bl.hidden=!online||over;bl.textContent=online&&online.alerts?"🔔 Turn alerts on":"🔔 Get turn alerts";
 cb.hidden=!online||!online.joined;document.getElementById("rulesb").hidden=cb.hidden;cb.textContent=unread?"💬 Taunt ("+unread+")":"💬 Taunt";cb.className=unread?"new":""}
function renderChat(){const l=document.getElementById("chl");l.innerHTML="";
 if(!chat.length){const d=document.createElement("div");d.className="none";d.textContent="No taunts yet. Start the trash talk.";l.appendChild(d)}
 chat.forEach(m=>{const d=document.createElement("div");d.className="m "+(m.s===online.seat?"me":"them")+" p"+m.s;d.textContent=m.t;l.appendChild(d)});l.scrollTop=l.scrollHeight}
function addMsgs(list){let fresh=0,any=false;
 for(const m of list){const id=m.s+":"+m.at;if(chatIds.has(id))continue;chatIds.add(id);chat.push(m);any=true;if(m.at>online.since)online.since=m.at;if(m.s!==online.seat){fresh++;if(!chatOpen&&Date.now()-m.at<20000)toast(m)}}
 if(!any)return;chat.sort((a,b)=>a.at-b.at);if(fresh&&!chatOpen)unread+=fresh;if(chatOpen)renderChat();tools()}
function toast(m){const t=document.getElementById("toast");t.innerHTML="";const d=document.createElement("div");d.className="tmsg";d.textContent="💬 "+m.t;t.appendChild(d);
 let x0=0,y0=0,dx=0,dy=0,down=false,gone=false;
 const kill=(ax,ay)=>{if(gone)return;gone=true;clearTimeout(tm);d.style.transition="transform .25s,opacity .25s";d.style.transform="translate("+ax+"px,"+ay+"px)";d.style.opacity="0";setTimeout(()=>d.remove(),260)};
 const tm=setTimeout(()=>kill(0,-60),4000+Math.min(3000,Math.max(0,m.t.length-40)*50));
 d.onpointerdown=e=>{down=true;x0=e.clientX;y0=e.clientY;d.setPointerCapture(e.pointerId)};
 d.onpointermove=e=>{if(!down)return;dx=e.clientX-x0;dy=e.clientY-y0;d.style.transform="translate("+dx+"px,"+dy+"px)"};
 d.onpointerup=()=>{if(!down)return;down=false;const m=Math.hypot(dx,dy);if(m>40)kill(dx*4,dy*4);else if(m<8){kill(0,-60);openChat()}else d.style.transform=""}}
function openChat(){chatOpen=true;unread=0;document.getElementById("chat").hidden=false;renderChat();tools();ping();setTimeout(()=>document.getElementById("chi").focus(),0)}
function closeChat(){chatOpen=false;document.getElementById("chat").hidden=true;tools()}
async function sendChat(){const i=document.getElementById("chi"),t=(i.value||"").trim();if(!t||!online)return;i.value="";i.placeholder="Taunt your friend";
 try{const j=await post({action:"say",code:online.code,token:online.token,text:t});addMsgs([{s:online.seat,t:t.slice(0,200),at:j.at}])}
 catch(e){i.value=t;i.placeholder=e.status===429?"Slow down a little…":"Couldn’t send. Try again."}}
document.getElementById("chatb").onclick=openChat;document.getElementById("chx").onclick=closeChat;document.getElementById("chs").onclick=sendChat;
document.getElementById("chi").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendChat()}});

const kb=document.getElementById("kb");
kb.innerHTML=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,i)=>'<div class="row">'+[...r].map(x=>'<button class="k" data-k="'+x+'">'+x+"</button>").join("")+(i===2?'<button class="k w" data-k="⌫" aria-label="Undo letter">⌫</button>':"")+"</div>").join("")+'<button id="end">Submit</button>';
kb.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="end"){submit();return}const k=b.dataset.k;if(k==="⌫")back();else type(k)};
document.addEventListener("keydown",e=>{if(chatOpen||document.getElementById("ovl").classList.contains("show")||e.metaKey||e.ctrlKey)return;
 if(/^[a-zA-Z]$/.test(e.key))type(e.key.toUpperCase());else if(e.key==="Backspace")back()});
const gq=new URLSearchParams(location.search).get("game");
start();render();
if(gq&&/^[A-Za-z0-9]{4,8}$/.test(gq)){const gc=gq.toUpperCase(),gk=new URLSearchParams(location.search).get("k");if(gk||saved.get(gc))joinGame(gc,gk);else askName(()=>joinGame(gc,gk))}else menu();
</script>
