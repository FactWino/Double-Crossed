<html lang="en">
<head>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">

<style>
:root{--bg:#F6F6F3;--ink:#16181D;--mut:#4F566A;--card:#fff;--line:#C4C9D4;--blk:#1F2430;--p1:#1F5FC4;--p1t:#DCE8FB;--p2:#B04400;--p2t:#FBE6D6;--hl:#FFF3BF;--cur:#FFD65C;--key:#fff;--keyb:#D5D9E2;--ok:#0B6B4D;--ovl:rgba(22,24,29,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141A;--ink:#ECEEF3;--mut:#A8AFC0;--card:#1C1F27;--line:#3A3F4D;--blk:#05060A;--p1:#8DB9FF;--p1t:#1E3358;--p2:#FFA066;--p2t:#4A2A14;--hl:#3F3A1C;--cur:#7A6414;--key:#2A2E3A;--keyb:#3A3F4D;--ok:#5BD3A5}}
:root[data-theme="dark"]{--bg:#12141A;--ink:#ECEEF3;--mut:#A8AFC0;--card:#1C1F27;--line:#3A3F4D;--blk:#05060A;--p1:#8DB9FF;--p1t:#1E3358;--p2:#FFA066;--p2t:#4A2A14;--hl:#3F3A1C;--cur:#7A6414;--key:#2A2E3A;--keyb:#3A3F4D;--ok:#5BD3A5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
.scores{display:flex;gap:8px}
.chip{flex:1;background:var(--card);border-radius:10px;padding:8px 10px;border-bottom:4px solid var(--line)}
.chip.on{border-bottom-color:currentColor}
.chip small{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.chip b{font-size:26px;line-height:1.1}
.p0{color:var(--p1)}.p1{color:var(--p2)}
.left{font-size:12px;color:var(--mut);margin-top:2px;letter-spacing:2px}
#grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--blk);width:100%;aspect-ratio:1;background:var(--blk)}
.c{position:relative;border:1px solid var(--line);background:var(--card);padding:0;font:700 clamp(16px,5.4vw,24px) system-ui,sans-serif;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:0;min-width:0}
.c.k{background:var(--blk);border-color:var(--blk)}
.c.hl{background:var(--hl)}
.c.cur{background:var(--cur);box-shadow:inset 0 0 0 4px var(--ink);z-index:2;transform:scale(1.14);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--ink),0 0 0 3px var(--cur)}}
.c.bad{background:rgba(214,40,40,.25)}.c.bad.cur{background:var(--cur)}
.pop{position:fixed;z-index:8;pointer-events:none;font:900 22px Georgia,serif;opacity:0;transform:translate(-60%,-60%);animation:pp 1.6s ease both;text-shadow:0 0 6px var(--bg),0 0 6px var(--bg),0 1px 0 var(--bg)}
.pop.st::before{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:-1;opacity:.35;background:repeating-conic-gradient(currentColor 0 7deg,transparent 7deg 30deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 72%);mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 72%)}
@keyframes pp{0%{opacity:0;transform:translate(-60%,-40%) scale(.5)}20%{opacity:1;transform:translate(-60%,-60%) scale(1.2)}70%{opacity:1;transform:translate(-60%,-90%) scale(1)}100%{opacity:0;transform:translate(-60%,-130%) scale(1)}}
.flash{position:fixed;left:0;right:0;top:34%;text-align:center;font:900 44px Georgia,serif;letter-spacing:2px;pointer-events:none;z-index:9;opacity:0;animation:fl 1.8s ease both;text-shadow:0 0 10px var(--bg),0 2px 0 var(--bg)}
@keyframes fl{0%{opacity:0;transform:scale(.6)}30%,60%{opacity:1;transform:scale(1.35)}100%{opacity:0;transform:scale(1)}}
.c.o0{color:var(--p1)}.c.o1{color:var(--p2)}
.c.s.o0{background:var(--p1t)}.c.s.o1{background:var(--p2t)}
.c i{position:absolute;top:1px;left:2px;font:600 9px system-ui;font-style:normal;color:var(--mut)}
#clue{background:var(--card);border-radius:10px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:8px;min-height:64px;border-left:6px solid currentColor}
#clue div{flex:1;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.3;color:var(--ink)}
#clue small{display:block;font:600 12px system-ui,sans-serif;color:var(--mut)}
.nav{width:44px;height:44px;border:1px solid var(--line);background:var(--key);color:var(--ink);border-radius:10px;font-size:20px}
#msg{min-height:20px;font-size:14px;color:var(--mut);text-align:center}
#kb{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:5px;justify-content:center}
.k{flex:1;min-width:0;height:46px;border:0;border-radius:8px;background:var(--key);color:var(--ink);font:600 18px system-ui,sans-serif;box-shadow:0 1px 0 var(--keyb)}
.k.w{flex:1.6;background:var(--keyb)}
#end{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#ovl{position:fixed;inset:0;background:var(--ovl);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
#ovl.show{display:flex}
#box{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
#box h1{margin:0;font:700 26px Georgia,serif}
#box p{margin:0;font-size:15px;line-height:1.45}
.big{height:50px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:700 17px system-ui,sans-serif}
#tools{display:flex;gap:8px;justify-content:center}
#bell,#chatb,#rulesb{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 14px;font:600 13px system-ui,sans-serif}
#bell[hidden],#chatb[hidden],#rulesb[hidden],#chat[hidden]{display:none}
#chatb.new{color:var(--ink);border-color:var(--ink)}
#chat{position:fixed;inset:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#chh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
#chh b{font:700 18px Georgia,serif}
#chx{width:44px;height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:18px}
#chl{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#chl .m{max-width:80%;padding:8px 12px;border-radius:14px;font-size:16px;line-height:1.35;background:var(--card);word-wrap:break-word;overflow-wrap:anywhere}
#chl .me{align-self:flex-end;border-bottom-right-radius:4px;background:var(--p1t);color:var(--ink)}
#chl .me.p1{background:var(--p2t)}
#chl .them{align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
#chl .none{margin:auto;color:var(--mut);font-size:14px;text-align:center}
#chf{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#chi{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:16px system-ui,sans-serif;background:var(--card);color:var(--ink)}
#chs{height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:700 16px system-ui,sans-serif}
.big.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
#lk{word-break:break-all;font-size:14px;background:var(--bg);padding:8px 10px;border-radius:8px;display:block}
</style>
</head>
<body>
<div id="app">
<div class="scores" id="scores"></div>
<div id="grid" role="grid" aria-label="Crossword grid"></div>
<div id="clue"></div>
<div id="msg" aria-live="polite"></div>
<div id="tools"><button id="bell" hidden>🔔 Get turn alerts</button><button id="rulesb" hidden>📖 Rules</button><button id="chatb" hidden>💬 Taunt</button></div>
<div id="kb"></div>
</div>
<div id="chat" hidden><div id="chh"><b>Taunts</b><button id="chx" aria-label="Close chat">✕</button></div><div id="chl" aria-live="polite"></div><div id="chf"><input id="chi" maxlength="200" placeholder="Taunt your friend" autocomplete="off" enterkeyhint="send" aria-label="Message"><button id="chs">Send</button></div></div>
<div id="ovl"><div id="box"></div></div>
<script>
(async()=>{const PZ=[];
 let miss=0;for(let i=1;i<=99&&miss<3;i++){let r=null;try{r=await fetch("puzzles/batch-"+String(i).padStart(3,"0")+".json",{cache:"no-cache"})}catch(e){}
  if(!r||!r.ok){miss++;continue}miss=0;try{const j=await r.json();if(Array.isArray(j))PZ.push(...j)}catch(e){}}
 if(!PZ.length){document.body.insertAdjacentHTML("afterbegin","<p style='padding:24px;color:#888'>Couldn’t load the puzzles. Please refresh.</p>");return}
 window.PZ=PZ;const s=document.createElement("script");s.textContent=document.getElementById("main").textContent;document.body.appendChild(s)})();
</script>
<script type="text/plain" id="main">
const pn0=(()=>{const m=/^#p(\d+)$/.exec(location.hash);if(m&&+m[1]>=1&&+m[1]<=PZ.length)return +m[1]-1;const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%PZ.length})();
let pn,G,CK;
const N=9,NAMES=["Player 1","Player 2"],DIR=["A","D"],DN=["Across","Down"];
const white=(r,c)=>r>=0&&c>=0&&r<N&&c<N&&G[r][c]!=="#";
let slots,nums,cw;function build(i){pn=i;G=PZ[i].grid;CK={};PZ[i].across.forEach(a=>CK["A"+a.num]=a.clue);PZ[i].down.forEach(a=>CK["D"+a.num]=a.clue);slots=[];nums={};cw={};let n=0;
for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!white(r,c))continue;
 const sa=!white(r,c-1)&&white(r,c+1),sd=!white(r-1,c)&&white(r+1,c);
 if(sa||sd){n++;nums[r+","+c]=n}
 [[sa,"A",0,1],[sd,"D",1,0]].forEach(([f,d,dr,dc])=>{if(!f)return;const cells=[];let a=r,b=c;
  while(white(a,b)){cells.push([a,b]);a+=dr;b+=dc}
  const ans=cells.map(([x,y])=>G[x][y]).join("");
  const s={dir:d,num:n,cells,ans,clue:CK[d+n]};slots.push(s);
  cells.forEach(([x,y])=>{(cw[x+","+y]=cw[x+","+y]||{})[d]=s})})}}
build(pn0);

const API="/api/game";
let L,turn,left,score,solved,cur,hist,msg,over,overShown,note="",online=null,timer=null,ev=null,lastEv=null,pop=null,lastPop=null,tb=0,lc=null,st=false;
const myTurn=()=>!online||turn===online.seat;
function start(){L=Array.from({length:N},()=>Array(N).fill(null));turn=0;left=3;score=[0,0];solved=new Set();hist=[];msg="";over=false;overShown=false;ev=null;pop=null;tb=0;lc=null;st=false;pick(null);}
const mine=()=>slots.filter(s=>s.dir===DIR[turn]&&!solved.has(s));
const editable=(r,c)=>!L[r][c]||L[r][c].bad;
function firstEmpty(w,from=0){for(let i=0;i<w.cells.length;i++){const [r,c]=w.cells[(from+i)%w.cells.length];if(editable(r,c))return [r,c]}return null}
function pick(w){if(!myTurn()){cur=null;return}const list=mine();w=w||list[0];if(!w){cur=null;return}cur={w,cell:firstEmpty(w)||w.cells[0]}}
function sel(r,c){if(!myTurn()){msg="Waiting for "+NAMES[turn]+"…";return render()}const w=(cw[r+","+c]||{})[DIR[turn]];if(!w||solved.has(w)){msg="Pick a square in one of your "+DN[turn]+" words.";return render()}cur={w,cell:[r,c]};msg="";render()}
function cycle(d){if(!myTurn())return;const l=mine();if(!l.length)return;let i=l.indexOf(cur&&cur.w);i=(i+d+l.length)%l.length;pick(l[i]);render()}
function type(ch){if(over||!cur||left<=0||!myTurn()||(online&&!online.joined))return;let [r,c]=cur.cell;
 const idx=(w,r,c)=>w.cells.findIndex(([x,y])=>x===r&&y===c);
 if(!editable(r,c)){const e=firstEmpty(cur.w,idx(cur.w,r,c)+1);if(!e)return;[r,c]=e}
 const fresh=!L[r][c];L[r][c]={ch,o:turn};lc=[r,c];left--;msg="";if(fresh)hist.push([r,c]);
 const out=[];
 DIR.forEach(d=>{const s=(cw[r+","+c]||{})[d];if(s&&!solved.has(s)&&s.cells.every(([x,y])=>L[x][y]))out.push(resolve(s,fresh))});
 if(out.length)msg=out.join(" ");
 if(solved.size===slots.length){mkPop();over=true;sync();return render()}
 if(!solved.has(cur.w)){const e=firstEmpty(cur.w,idx(cur.w,r,c)+1);if(e)cur.cell=e;else pick()}else pick();
 if(left===0)return endTurn();sync();render()}
function resolve(s,fresh){hist=[];const dn=DN[s.dir==="A"?0:1];
 const wrong=s.cells.filter(([x,y])=>L[x][y].ch!==G[x][y]);
 if(!wrong.length){solved.add(s);const steal=s.dir!==DIR[turn];const p=(steal?15:10)+s.cells.length;score[turn]+=p;
  if(steal){st=true;s.cells.forEach(([x,y])=>{L[x][y].o=turn});ev={id:Date.now(),txt:"STOLEN! +"+p,o:turn};lastEv=ev.id;flash(ev)}
  return s.num+" "+dn+": correct, +"+p+(steal?" (steal)":"")+" for "+NAMES[turn]+"."}
 const nw=wrong.filter(([x,y])=>!L[x][y].bad);
 nw.forEach(([x,y])=>{score[L[x][y].o]-=1});wrong.forEach(([x,y])=>{L[x][y].bad=true});
 if(fresh&&nw.length)score[turn]-=2;
 return s.num+" "+dn+": not right. "+wrong.length+" wrong letter"+(wrong.length>1?"s":"")+" marked red."+(nw.length?" −1 each to who wrote them"+(fresh?", −2 for "+NAMES[turn]:"")+".":"")}
function mkPop(){if(!lc){pop=null;return}const d=score[turn]-tb;pop={id:Date.now(),txt:(d<0?"−":"+")+Math.abs(d),o:turn,r:lc[0],c:lc[1],steal:st};lastPop=pop.id;setTimeout(()=>popover(pop),80)}
function popover(p){const b=document.querySelector('#grid button[data-r="'+p.r+'"][data-c="'+p.c+'"]');if(!b)return;const R=b.getBoundingClientRect(),d=document.createElement("div");d.className="pop p"+p.o+(p.steal?" st":"");d.textContent=p.txt;d.style.left=R.right+"px";d.style.top=R.top+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function flash(e){const d=document.createElement("div");d.className="flash p"+e.o;d.textContent=e.txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
function back(){if(over||!hist.length||!myTurn())return;const [r,c]=hist.pop();L[r][c]=null;left++;const w=(cw[r+","+c]||{})[DIR[turn]];if(w)cur={w,cell:[r,c]};sync();render()}
function endTurn(){if(!myTurn())return;const last=msg;msg="";mkPop();turn=1-turn;tb=score[turn];lc=null;st=false;left=3;hist=[];
 if(online){msg=last;cur=null;sync();return render()}
 pick(null);render();
 show("<h1>"+NAMES[turn]+", you’re up</h1><p>"+(last?last+"<br><br>":"")+"You play <b>"+DN[turn]+"</b>. Pass the phone, then tap when you’re ready.</p>","Start my turn")}
function ask(html,btns){const o=document.getElementById("ovl"),b=document.getElementById("box");
 b.innerHTML=html+btns.map((x,i)=>'<button class="big'+(x[2]?" alt":"")+'" data-i="'+i+'">'+x[0]+"</button>").join("");o.classList.add("show");
 b.querySelectorAll("button").forEach(el=>{el.onclick=()=>{const x=btns[+el.dataset.i];if(!x[3])o.classList.remove("show");if(x[1])x[1](el)}});
 const f=b.querySelector("button");if(f)f.focus()}
const show=(html,label,fn)=>ask(html,[[label,fn]]);
const rules="<p>Finish a word and score: 10 + 1 per letter for your own direction, 15 + 1 per letter for a steal. Wrong letters are marked red and cost −1 for whoever wrote them, and −2 for whoever finished the wrong word. Tap a red letter to replace it. Correct letters can’t be changed.</p>";
function render(){
 const my=myTurn();
 document.getElementById("scores").innerHTML=[0,1].map(i=>'<div class="chip p'+i+(i===turn&&!over?" on":"")+'"><small>'+NAMES[i]+(online&&i===online.seat?" (you)":"")+" · "+DN[i]+"</small><b>"+score[i]+"</b>"+(i===turn&&!over?'<div class="left" aria-label="'+left+' letters left">'+"●".repeat(left)+"○".repeat(3-left)+"</div>":"")+"</div>").join("");
 let h="";for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=r+","+c;
  if(!white(r,c)){h+='<div class="c k"></div>';continue}
  const v=L[r][c],isCur=cur&&cur.cell[0]===r&&cur.cell[1]===c,inW=cur&&cur.w.cells.some(([x,y])=>x===r&&y===c);
  const sv=["A","D"].some(d=>cw[k][d]&&solved.has(cw[k][d]));
  h+='<button class="c'+(v?" o"+v.o:"")+(v&&v.bad?" bad":"")+(sv?" s":"")+(inW?" hl":"")+(isCur?" cur":"")+'" data-r="'+r+'" data-c="'+c+'" aria-label="Row '+(r+1)+", column "+(c+1)+(v?", "+v.ch:", empty")+'">'+(nums[k]?"<i>"+nums[k]+"</i>":"")+(v?v.ch:"")+"</button>"}
 const g=document.getElementById("grid");g.innerHTML=h;g.querySelectorAll("button").forEach(b=>b.onclick=()=>sel(+b.dataset.r,+b.dataset.c));
 const cl=document.getElementById("clue");cl.className="p"+turn;
 cl.innerHTML=cur&&my?'<button class="nav" aria-label="Previous word">‹</button><div><small>'+cur.w.num+" "+DN[turn]+" · "+cur.w.cells.length+" letters</small>"+cur.w.clue+'</div><button class="nav" aria-label="Next word">›</button>':(over?"<div>Game over.</div>":(!my?"<div>Waiting for "+NAMES[turn]+"…<small>Their letters appear here as they play.</small></div>":"<div>No words left.</div>"));
 if(cur&&my){const b=cl.querySelectorAll(".nav");b[0].onclick=()=>cycle(-1);b[1].onclick=()=>cycle(1)}
 document.getElementById("msg").textContent=note||msg;
 tools();
 if(over&&!overShown){overShown=true;const w=score[0]===score[1]?"It’s a tie.":NAMES[score[0]>score[1]?0:1]+" wins.";
  const html="<h1>"+w+"</h1><p>"+NAMES[0]+": "+score[0]+"<br>"+NAMES[1]+": "+score[1]+"</p>";
  if(online)show(html,"New game",()=>{location.href=location.pathname});
  else show(html,"Play again",()=>{build(pn+1>=PZ.length?0:pn+1);start();render();intro()})}}
const TUT=["<h1>How it works</h1><p>One grid, two players. One of you solves the Across clues, the other solves the Down clues. Take turns writing up to 3 letters.</p>","<h1>Scoring</h1><p>Finish a word to score 10 + 1 per letter. Finish a word in your opponent’s direction and you <b>steal</b> it: 15 + 1 per letter, and the whole word turns your color.</p>","<h1>Mistakes</h1><p>When a word is full but wrong, the wrong letters turn red. They cost −1 for whoever wrote them, and −2 for whoever finished the word. Tap a red letter and type a new one. Correct letters are locked.</p>","<h1>Your turn</h1><p>Tap a square in one of your words, then type. The highlighted square is where your next letter goes. Use ⌫ to undo a letter, or End turn to pass early.</p>"];
function tut(i,skipLabel){const last=i===TUT.length-1;
 ask(TUT[i]+'<p style="color:var(--mut);font-size:13px">'+(i+1)+" of "+TUT.length+"</p>",last?[["Got it"]]:[["Next",()=>tut(i+1,skipLabel),0,1],[skipLabel||"Close",null,1]])}
function firstTut(){try{if(!localStorage.getItem("cd-tut")){localStorage.setItem("cd-tut","1");tut(0,"Skip")}}catch(e){}}
document.getElementById("rulesb").onclick=()=>tut(0,"Close");
function intro(){show("<h1>Klepto Cross</h1><p>"+NAMES[0]+" solves the Across clues. "+NAMES[1]+" solves the Down clues. Take turns writing up to 3 letters.</p>"+rules,"Start game")}
function menu(){ask("<h1>Klepto Cross</h1><p>Puzzle "+(pn+1)+" of "+PZ.length+". "+NAMES[0]+" solves the Across clues. "+NAMES[1]+" solves the Down clues. Take turns writing up to 3 letters.</p>"+rules+"<p>If you invite a friend, you’ll be randomly given Across or Down.</p>",
 [["Invite a friend",createGame]])}

/* ---------- two-phone play ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function call(q,opt){const r=await fetch(API+q,opt);let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||"http "+r.status);e.status=r.status;throw e}return j}
const post=b=>call("",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
const saved={get(c){try{return JSON.parse(localStorage.getItem("cd-"+c))}catch(e){return null}},set(c,v){try{localStorage.setItem("cd-"+c,JSON.stringify(v))}catch(e){}}};
const snap=()=>({L,turn,left,score,solved:[...solved].map(s=>slots.indexOf(s)),over,msg,ev,pop,tb,lc,st});
function applySnap(s,loud){tb=s.tb||0;lc=s.lc||null;st=!!s.st;pop=s.pop||null;if(pop){if(loud&&pop.id!==lastPop)setTimeout(()=>popover(pop),80);lastPop=pop.id}ev=s.ev||null;if(ev){if(loud&&ev.id!==lastEv)flash(ev);lastEv=ev.id}L=s.L;turn=s.turn;left=s.left;score=s.score;solved=new Set(s.solved.map(i=>slots[i]));over=s.over;msg=s.msg||"";hist=[];cur=null;if(myTurn()&&!over)pick(null)}
const link=()=>location.origin+location.pathname+"?game="+online.code;
function sync(){if(!online)return;online.dirty=true;if(!online.pushing)flush()}
async function flush(){online.pushing=true;
 while(online.dirty){online.dirty=false;
  try{const j=await post({action:"push",code:online.code,token:online.token,version:online.ver,state:snap()});online.ver=j.version;if(note){note="";render()}}
  catch(e){if(e.status===409||e.status===403){try{await pollOnce(true)}catch(x){}}else{online.dirty=true;note="Connection problem, retrying…";render();await sleep(1500)}}}
 online.pushing=false}
async function pollOnce(force){if(!online)return;
 const q="?code="+encodeURIComponent(online.code)+"&token="+encodeURIComponent(online.token)+(Date.now()-lastInput<180000?"&ping=1":"")+(online.joined?"&since="+Math.max(0,online.since-5000):"");
 const j=await call(q,{cache:"no-store"});
 if(j.chat)addMsgs(j.chat);
 if(note){note="";render()}
 if(!online.joined&&j.joined){online.joined=true;ask("<h1>Your friend joined!</h1><p>You play <b>"+DN[online.seat]+"</b>. "+(online.seat===0?"You go first.":NAMES[0]+" goes first, and the board updates when it’s your turn.")+"</p>"+rules,[["Start",()=>{render();firstTut()}]])}
 if(j.version>online.ver&&(force||turn!==online.seat)){const prev=turn;online.ver=j.version;applySnap(j.state,true);render();
  if(!over&&prev!==turn&&turn===online.seat)show("<h1>Your turn</h1><p>"+(msg?msg+"<br><br>":"")+"You play <b>"+DN[turn]+"</b>.</p>","Start my turn",()=>render())}}
function loop(){clearInterval(timer);timer=setInterval(()=>{if(online&&!document.hidden&&!online.pushing&&(!over||chatOpen))pollOnce().catch(()=>{})},4000)}
document.addEventListener("visibilitychange",()=>{if(online&&!document.hidden&&!over)pollOnce().catch(()=>{})});
function waitScreen(){ask('<h1>Invite a friend</h1><p>Send this link to a friend. When they open it, the game begins. You play <b>'+DN[online.seat]+'</b>'+(online.seat===0?' and go first.':'. Your friend goes first.')+'</p><b id="lk"></b>',
 [["Share link",async el=>{const u=link();try{if(navigator.share){await navigator.share({title:"Klepto Cross",text:"Join me for a crossword duel!",url:u});return}}catch(e){if(e&&e.name==="AbortError")return}
   try{await navigator.clipboard.writeText(u);el.textContent="Link copied ✓"}catch(e){el.textContent="Copy the link above"}},0,1],
  ["Cancel",()=>{location.href=location.pathname},1]]);
 document.getElementById("lk").textContent=link()}
const keep=()=>{try{history.replaceState(null,"","?game="+online.code+"&k="+online.token)}catch(e){}};
async function createGame(){
 try{start();const j=await post({action:"create",pz:pn,state:snap()});
  online={code:j.code,token:j.token,seat:j.seat,ver:j.version,joined:false,pushing:false,dirty:false,alerts:false,since:0};saved.set(j.code,{token:j.token,seat:j.seat});
  keep();render();waitScreen();loop();ping();autoAlerts()}
 catch(e){online=null;ask("<h1>Couldn’t start</h1><p>The game server didn’t answer. Check your connection and try again.</p>",[["Back",menu]])}}
async function joinGame(code,kt){let me=saved.get(code);
 try{
  if(kt){const j=await call("?code="+code+"&token="+encodeURIComponent(kt),{cache:"no-store"});if(j.seat===0||j.seat===1){me={token:kt,seat:j.seat};saved.set(code,me)}}
  if(me&&me.token){const j=await call("?code="+code,{cache:"no-store"});build(j.pz);
   online={code,token:me.token,seat:me.seat,ver:j.version,joined:j.joined,pushing:false,dirty:false,alerts:false,since:0};applySnap(j.state);keep();render();loop();ping();autoAlerts();
   if(!j.joined)waitScreen();else if(!over)show("<h1>Welcome back</h1><p>You play <b>"+DN[online.seat]+"</b>."+(myTurn()?" It’s your turn.":" Waiting for "+NAMES[turn]+".")+"</p>","Continue",()=>render());
   return}
  const j=await post({action:"join",code});build(j.pz);
  online={code,token:j.token,seat:j.seat,ver:j.version,joined:true,pushing:false,dirty:false,alerts:false,since:0};saved.set(code,{token:j.token,seat:j.seat});
  applySnap(j.state);keep();render();loop();ping();autoAlerts();
  show("<h1>You’re in!</h1><p>You play <b>"+DN[online.seat]+"</b>. "+(myTurn()?"You go first.":NAMES[0]+" goes first, and the board updates when it’s your turn.")+"</p>"+rules,"OK",()=>{render();firstTut()})}
 catch(e){online=null;ask("<h1>Can’t join</h1><p>"+(e.status===409?"This game already has two players.":e.status===404?"That game wasn’t found. Ask your friend for a new link.":"The game server didn’t answer. Try again in a moment.")+"</p>",[["Back to start",()=>{location.href=location.pathname}]])}}

/* ---------- turn alerts ---------- */
// "I'm here" signal: sent only while the page is visible and touched in the last 3 minutes.
// The server skips the alert while these keep arriving, and sends one when they stop.
let lastInput=Date.now();
["pointerdown","keydown"].forEach(t=>document.addEventListener(t,()=>{lastInput=Date.now()},{passive:true}));
function ping(){if(online)pollOnce().catch(()=>{})}
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const b64u=t=>{const p="=".repeat((4-t.length%4)%4),r=atob((t+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function enableAlerts(tap){if(!online)return;
 if(!pushOK()){if(tap)ask("<h1>Turn alerts</h1><p>This browser can’t show alerts. <b>On iPhone:</b> tap the Share button in Safari, choose <b>Add to Home Screen</b>, then open the game from that icon and tap this button again. <b>On Android or a computer:</b> use Chrome or Edge.</p>",[["OK"]]);return}
 try{
  if(Notification.permission==="denied"){if(tap)ask("<h1>Alerts are blocked</h1><p>Allow notifications for this site in your phone’s or browser’s settings, then tap the button again.</p>",[["OK"]]);return}
  if(Notification.permission!=="granted"){if(!tap)return;if(await Notification.requestPermission()!=="granted"){render();return}}
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub){const k=await call("?vapid=1");sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.publicKey)})}
  await post({action:"subscribe",code:online.code,token:online.token,sub:sub.toJSON()});online.alerts=true;render()}
 catch(e){if(tap)ask("<h1>Couldn’t turn on alerts</h1><p>Something went wrong. Please try again in a moment.</p>",[["OK"]])}}
async function disableAlerts(){try{await post({action:"unsubscribe",code:online.code,token:online.token})}catch(e){}online.alerts=false;render()}
function autoAlerts(){if(pushOK()&&Notification.permission==="granted")enableAlerts(false)}
document.getElementById("bell").onclick=()=>{if(online)online.alerts?disableAlerts():enableAlerts(true)};
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")}catch(e){}

/* ---------- chat ---------- */
let chat=[],chatIds=new Set(),unread=0,chatOpen=false;
function tools(){const bl=document.getElementById("bell"),cb=document.getElementById("chatb");
 bl.hidden=!online||over;bl.textContent=online&&online.alerts?"🔔 Turn alerts on":"🔔 Get turn alerts";
 cb.hidden=!online||!online.joined;document.getElementById("rulesb").hidden=cb.hidden;cb.textContent=unread?"💬 Taunt ("+unread+")":"💬 Taunt";cb.className=unread?"new":""}
function renderChat(){const l=document.getElementById("chl");l.innerHTML="";
 if(!chat.length){const d=document.createElement("div");d.className="none";d.textContent="No taunts yet. Start the trash talk.";l.appendChild(d)}
 chat.forEach(m=>{const d=document.createElement("div");d.className="m "+(m.s===online.seat?"me":"them")+" p"+m.s;d.textContent=m.t;l.appendChild(d)});l.scrollTop=l.scrollHeight}
function addMsgs(list){let fresh=0,any=false;
 for(const m of list){const id=m.s+":"+m.at;if(chatIds.has(id))continue;chatIds.add(id);chat.push(m);any=true;if(m.at>online.since)online.since=m.at;if(m.s!==online.seat)fresh++}
 if(!any)return;chat.sort((a,b)=>a.at-b.at);if(fresh&&!chatOpen)unread+=fresh;if(chatOpen)renderChat();tools()}
function openChat(){chatOpen=true;unread=0;document.getElementById("chat").hidden=false;renderChat();tools();ping();setTimeout(()=>document.getElementById("chi").focus(),0)}
function closeChat(){chatOpen=false;document.getElementById("chat").hidden=true;tools()}
async function sendChat(){const i=document.getElementById("chi"),t=(i.value||"").trim();if(!t||!online)return;i.value="";i.placeholder="Taunt your friend";
 try{const j=await post({action:"say",code:online.code,token:online.token,text:t});addMsgs([{s:online.seat,t:t.slice(0,200),at:j.at}])}
 catch(e){i.value=t;i.placeholder=e.status===429?"Slow down a little…":"Couldn’t send. Try again."}}
document.getElementById("chatb").onclick=openChat;document.getElementById("chx").onclick=closeChat;document.getElementById("chs").onclick=sendChat;
document.getElementById("chi").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendChat()}});

const kb=document.getElementById("kb");
kb.innerHTML=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,i)=>'<div class="row">'+[...r].map(x=>'<button class="k" data-k="'+x+'">'+x+"</button>").join("")+(i===2?'<button class="k w" data-k="⌫" aria-label="Undo letter">⌫</button>':"")+"</div>").join("")+'<button id="end">End turn</button>';
kb.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="end"){if(!over)endTurn();return}const k=b.dataset.k;if(k==="⌫")back();else type(k)};
document.addEventListener("keydown",e=>{if(chatOpen||document.getElementById("ovl").classList.contains("show")||e.metaKey||e.ctrlKey)return;
 if(/^[a-zA-Z]$/.test(e.key))type(e.key.toUpperCase());else if(e.key==="Backspace")back()});
const gq=new URLSearchParams(location.search).get("game");
start();render();
if(gq&&/^[A-Za-z0-9]{4,8}$/.test(gq))joinGame(gq.toUpperCase(),new URLSearchParams(location.search).get("k"));else menu();
</script>
</body>
</html>
